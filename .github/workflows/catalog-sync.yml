name: Propor atualização do catálogo

on:
  repository_dispatch:
    types:
      - book-release

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: projetorealmat/.github/.github/workflows/portal-catalog-sync.yml@v1
    with:
      payload: ${{ toJSON(github.event.client_payload) }}
      catalog_file: _data/books.json
      validator_script: scripts/validate_catalog.py
    secrets: inherit
