name: Propor atualização do catálogo

on:
  repository_dispatch:
    types:
      - book-release

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  propose:
    name: Abrir PR de atualização do catálogo
    runs-on: ubuntu-24.04
    env:
      DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Baixar o portal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Atualizar o catálogo em uma branch de automação
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(os.environ.get("DISPATCH_PAYLOAD") or "{}")
          required = (
              "id", "title", "short_title", "subject", "version", "status",
              "repository", "ref", "release_url", "pdf_url", "pdf_path", "sha256",
          )
          missing = [key for key in required if not payload.get(key)]
          if missing:
              raise SystemExit(f"Payload da release incompleto: {', '.join(missing)}")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", payload["version"]):
              raise SystemExit("A versão recebida não segue vMAJOR.MINOR.PATCH.")
          if payload["ref"] in {"main", "master", "HEAD", "develop", "dev"}:
              raise SystemExit("O catálogo não pode apontar para uma branch de desenvolvimento.")

          catalog_path = Path("_data/books.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          replacement = {key: payload[key] for key in required}
          for index, item in enumerate(catalog):
              if item.get("id") == payload["id"]:
                  catalog[index] = replacement
                  break
          else:
              catalog.append(replacement)

          rendered = json.dumps(catalog, ensure_ascii=False, indent=2) + "\n"
          changed = catalog_path.read_text(encoding="utf-8") != rendered
          if changed:
              catalog_path.write_text(rendered, encoding="utf-8")

          branch = f"automation/catalog-{payload['id']}-{payload['version']}-{os.environ['GITHUB_RUN_ID']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
              output.write(f"branch={branch}\n")
              output.write(f"version={payload['version']}\n")
              output.write(f"book_id={payload['id']}\n")
          PY

          if [[ "${{ steps.catalog.outputs.changed }}" != "true" ]]; then
            echo "O catálogo já está atualizado para esta release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${{ steps.catalog.outputs.branch }}"
          git add _data/books.json
          git commit -m "chore(catalog): sync ${{ steps.catalog.outputs.book_id }} ${{ steps.catalog.outputs.version }}"
          git push --set-upstream origin "${{ steps.catalog.outputs.branch }}"

      - name: Abrir pull request do catálogo
        if: steps.catalog.outputs.changed == 'true'
        env:
          BOOK_ID: ${{ steps.catalog.outputs.book_id }}
          VERSION: ${{ steps.catalog.outputs.version }}
          BRANCH: ${{ steps.catalog.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(catalog): atualizar ${BOOK_ID} para ${VERSION}" \
            --body "Esta atualização foi proposta automaticamente a partir da release ${VERSION} de ${BOOK_ID}. Revise os metadados e aguarde os checks do portal antes de fazer o merge."
