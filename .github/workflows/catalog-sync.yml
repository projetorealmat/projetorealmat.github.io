name: Propor atualização do catálogo

on:
  repository_dispatch:
    types:
      - book-release

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  propose:
    name: Abrir PR de atualização do catálogo
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Baixar o portal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validar payload e preparar catálogo
        id: catalog
        shell: bash
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(os.environ.get("DISPATCH_PAYLOAD") or "{}")
          book = payload.get("book")
          if not isinstance(book, dict):
              raise SystemExit("O payload deve conter o objeto book.")

          required_book = ("id", "title", "short_title", "subject")
          required_release = (
              "version", "status", "repository", "ref", "release_url",
              "pdf_url", "pdf_path", "sha256",
          )
          missing_book = [
              key for key in required_book
              if not isinstance(book.get(key), str) or not book[key].strip()
          ]
          missing_release = [
              key for key in required_release
              if not isinstance(book.get(key), str) or not book[key].strip()
          ]
          missing = missing_book + missing_release
          if missing:
              raise SystemExit(f"Payload da release incompleto: {', '.join(missing)}")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", book["id"]):
              raise SystemExit("O id do livro contém caracteres não permitidos.")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", book["version"]):
              raise SystemExit("A versão recebida não segue vMAJOR.MINOR.PATCH.")
          if book["ref"] != book["version"]:
              raise SystemExit("A release deve apontar para a mesma tag semver declarada na versão.")
          if not re.fullmatch(r"[^/\s]+/[^/\s]+", book["repository"]):
              raise SystemExit("O repositório recebido é inválido.")
          if book.get("release_date") and not re.fullmatch(r"\d{4}-\d{2}-\d{2}", book["release_date"]):
              raise SystemExit("release_date deve usar YYYY-MM-DD.")

          release_fields = required_release
          release = {key: book[key] for key in release_fields}
          if book.get("release_date"):
              release["release_date"] = book["release_date"]

          catalog_path = Path("_data/books.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          book_record = {
              key: book[key]
              for key in required_book
          }
          book_record["current_version"] = book["version"]

          def version_key(value):
              return tuple(int(part) for part in value[1:].split("."))

          for index, item in enumerate(catalog):
              if item.get("id") != book["id"]:
                  continue

              existing_releases = item.get("releases")
              if not existing_releases and item.get("version"):
                  existing_releases = [
                      {
                          key: item[key]
                          for key in release_fields
                          if key in item
                      }
                  ]
              existing_releases = existing_releases or []

              replaced = False
              for release_index, existing in enumerate(existing_releases):
                  if existing.get("version") == release["version"]:
                      existing_releases[release_index] = release
                      replaced = True
                      break
              if not replaced:
                  existing_releases.append(release)

              item.update(book_record)
              item["releases"] = sorted(
                  existing_releases,
                  key=lambda candidate: version_key(candidate["version"]),
                  reverse=True,
              )
              catalog[index] = item
              break
          else:
              catalog.append({
                  **book_record,
                  "releases": [release],
              })

          rendered = json.dumps(catalog, ensure_ascii=False, indent=2) + "
"
          changed = catalog_path.read_text(encoding="utf-8") != rendered
          if changed:
              catalog_path.write_text(rendered, encoding="utf-8")

          branch = f"automation/catalog-{book['id']}-{book['version']}-{os.environ['GITHUB_RUN_ID']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}
")
              output.write(f"branch={branch}
")
              output.write(f"version={book['version']}
")
              output.write(f"book_id={book['id']}
")
              output.write(f"release_url={book['release_url']}
")
          PY

          python3 scripts/validate_catalog.py _data/books.json

      - name: Publicar branch de automação
        if: steps.catalog.outputs.changed == 'true'
        env:
          BOOK_ID: ${{ steps.catalog.outputs.book_id }}
          VERSION: ${{ steps.catalog.outputs.version }}
          BRANCH: ${{ steps.catalog.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add _data/books.json
          git commit -m "chore(catalog): sync ${BOOK_ID} ${VERSION}"
          git push --set-upstream origin "${BRANCH}"

      - name: Abrir pull request do catálogo
        if: steps.catalog.outputs.changed == 'true'
        env:
          BOOK_ID: ${{ steps.catalog.outputs.book_id }}
          VERSION: ${{ steps.catalog.outputs.version }}
          BRANCH: ${{ steps.catalog.outputs.branch }}
          RELEASE_URL: ${{ steps.catalog.outputs.release_url }}
        run: |
          set -euo pipefail
          gh pr create             --base main             --head "${BRANCH}"             --title "chore(catalog): atualizar ${BOOK_ID} para ${VERSION}"             --body "Atualização proposta automaticamente a partir da release ${VERSION} de ${BOOK_ID}. Fonte: ${RELEASE_URL}. Revise os metadados e aguarde os checks do portal antes de fazer o merge."
