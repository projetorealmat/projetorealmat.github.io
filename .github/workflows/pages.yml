name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cada PR tem sua própria fila; o deploy da main continua serializado.
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Baixar o portal REALMAT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ler catálogo versionado
        id: book
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog = json.loads(Path("_data/books.json").read_text(encoding="utf-8"))
          book = next((item for item in catalog if item.get("id") == "forallx"), None)
          if book is None:
              raise SystemExit("O catálogo não contém o livro forallx.")

          required = ("repository", "ref", "version", "status", "pdf_path", "release_url")
          missing = [key for key in required if not book.get(key)]
          if missing:
              raise SystemExit(f"Campos ausentes no catálogo: {', '.join(missing)}")
          if book["ref"] in {"main", "master", "HEAD"}:
              raise SystemExit("O portal não pode compilar diretamente uma branch de desenvolvimento.")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"repository={book['repository']}\n")
              stream.write(f"ref={book['ref']}\n")
              stream.write(f"version={book['version']}\n")
              stream.write(f"status={book['status']}\n")
          PY

      - name: Baixar a fonte do forallx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.book.outputs.repository }}
          ref: ${{ steps.book.outputs.ref }}
          path: .book/forallx
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar TeX Live com XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-english \
            texlive-lang-portuguese \
            texlive-xetex \
            latexmk

      - name: Compilar o forallx
        working-directory: .book/forallx
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error forallx.tex

      - name: Disponibilizar o PDF no portal
        run: |
          mkdir -p assets/books
          cp .book/forallx/forallx.pdf assets/books/forallx.pdf
          printf 'Fonte compilada: %s@%s\\n' "${{ steps.book.outputs.repository }}" "${{ steps.book.outputs.ref }}" > assets/books/forallx-source.txt
          rm -rf .book

      - name: Verificar a integração original do Massively
        run: python3 scripts/test_massively_theme.py

      - name: Verificar JavaScript da busca
        run: node --check assets/js/realmat-search.js

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Construir o site Jekyll
        id: build
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Verificar o site gerado
        run: python3 scripts/test_built_site.py ./_site

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
