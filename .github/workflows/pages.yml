name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cada PR tem sua própria fila; o deploy da main continua serializado.
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Baixar o portal REALMAT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar contrato do catálogo
        run: python3 scripts/test_catalog_evolution.py

      - name: Validar catálogo versionado
        run: python3 scripts/validate_catalog.py _data/books.json

      - name: Baixar e verificar PDFs oficiais
        run: python3 scripts/download_catalog_assets.py

      - name: Gerar páginas dos livros
        run: python3 scripts/generate_book_pages.py

      - name: Verificar a integração original do Massively
        run: python3 scripts/test_massively_theme.py

      - name: Verificar JavaScript da busca
        run: node --check assets/js/realmat-search.js

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Construir o site Jekyll
        id: build
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Verificar o site gerado
        run: python3 scripts/test_built_site.py ./_site

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
