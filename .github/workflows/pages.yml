name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o portal REALMAT
        uses: actions/checkout@v4

      - name: Baixar a fonte do forallx
        uses: actions/checkout@v4
        with:
          repository: projetorealmat/forallx
          ref: main
          path: .book/forallx
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar TeX Live com XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-english \
            texlive-lang-portuguese \
            texlive-xetex \
            latexmk

      - name: Compilar o forallx
        working-directory: .book/forallx
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error forallx.tex

      - name: Disponibilizar o PDF no portal
        run: |
          mkdir -p assets/books
          cp .book/forallx/forallx.pdf assets/books/forallx.pdf
          rm -rf .book

      - name: Verificar a skin editorial
        run: python3 scripts/test_editorial_skin.py

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construir o site Jekyll
        id: build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verificar o site gerado
        run: python3 scripts/test_built_site.py ./_site

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
