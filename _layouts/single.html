---
layout: default
---
{%- assign page_description = page.description | default: page.excerpt -%}
<article class="realmat-page" itemscope itemtype="https://schema.org/CreativeWork">
  <header class="realmat-page__hero">
    <div class="realmat-page__hero-inner">
      <p class="realmat-kicker">{{ page.kicker | default: "REALMAT" }}</p>
      {% if page.title %}
        <h1 class="realmat-page__title" itemprop="headline">{{ page.title }}</h1>
      {% endif %}
      {% if page_description %}
        <p class="realmat-page__description" itemprop="description">{{ page_description | strip_html }}</p>
      {% endif %}
    </div>
  </header>

  <div class="realmat-page__body">
    <div class="realmat-prose e-content" itemprop="text">
      {{ content }}
    </div>
  </div>
</article>
